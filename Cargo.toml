[workspace]
resolver = "3"
members = ["core", "docs-tests", "json"]
exclude = ["json/fuzz"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filip-41/structury"
rust-version = "1.96"

[workspace.dependencies]
structury = { path = "core", version = "0.1.0-alpha.1" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
