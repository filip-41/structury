name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.96"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (pedantic)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The only `unsafe` in the workspace is `core/src/byte_scan.rs`, and it is not
  # reached by the default gate. Miri is slow (~8 min), so it is a separate job:
  # ubuntu-latest covers the SSE2 baseline (Miri does not report AVX2), macos-latest
  # covers the NEON kernels. `make miri` runs the same command locally.
  miri:
    name: miri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: miri (strict provenance)
        run: cargo miri test -p structury --features byte-scan byte_scan
